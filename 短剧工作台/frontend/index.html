      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23409eff'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>短剧生产工作台</title>
    <script>
      // 字号档位：在样式生效前就定好，避免首屏字号跳一下
      (function () {
        var OK = ['compact', 'normal', 'large', 'xlarge'];
        var v = null;
        try { v = localStorage.getItem('studio.fontScale'); } catch (e) {}
        document.documentElement.dataset.fs = OK.indexOf(v) >= 0 ? v : 'large';
      })();
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
